<!doctype html>
<html lang="es" style="background:#0f172a">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- HIG: viewport sin zoom de usuario, con soporte de safe-area -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- PWA / iOS meta tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Estudio Jurídico" />
    <meta name="theme-color" content="#4f46e5" />
    <title>Estudio Jurídico</title>
  </head>
  <body>
    <div id="splash">
      <style>
        #splash {
          position: fixed;
          inset: 0;
          z-index: 9999;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: linear-gradient(160deg, #0f172a 0%, #0d1629 60%, #0f0f23 100%);
          transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        #splash.hide {
          opacity: 0;
          visibility: hidden;
          pointer-events: none;
        }
        .splash-orb {
          position: absolute;
          top: 0;
          left: 50%;
          transform: translateX(-50%);
          width: 400px;
          height: 400px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(99,102,241,0.18) 0%, transparent 70%);
          pointer-events: none;
        }
        .splash-icon-wrap {
          position: relative;
          animation: splashPop 0.6s cubic-bezier(0.34,1.56,0.64,1) forwards;
          opacity: 0;
        }
        .splash-glow {
          position: absolute;
          inset: -8px;
          border-radius: 36px;
          background: rgba(99,102,241,0.35);
          filter: blur(20px);
          animation: splashGlow 2s ease-in-out 0.4s infinite alternate;
        }
        .splash-icon {
          position: relative;
          width: 96px;
          height: 96px;
          border-radius: 28px;
          background: linear-gradient(135deg, #4f46e5, #6366f1);
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 48px;
          box-shadow: 0 8px 40px rgba(99,102,241,0.5);
        }
        .splash-title {
          margin-top: 20px;
          color: white;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
          font-size: 22px;
          font-weight: 700;
          letter-spacing: -0.3px;
          animation: splashFadeUp 0.5s ease 0.5s forwards;
          opacity: 0;
        }
        .splash-subtitle {
          margin-top: 6px;
          color: rgba(148,163,184,0.8);
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
          font-size: 13px;
          animation: splashFadeUp 0.5s ease 0.65s forwards;
          opacity: 0;
        }
        .splash-dots {
          display: flex;
          gap: 6px;
          margin-top: 48px;
          animation: splashFadeUp 0.5s ease 0.8s forwards;
          opacity: 0;
        }
        .splash-dot {
          width: 6px;
          height: 6px;
          border-radius: 50%;
          background: rgba(99,102,241,0.6);
          animation: splashBounce 1.2s ease-in-out infinite;
        }
        .splash-dot:nth-child(2) { animation-delay: 0.2s; }
        .splash-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes splashPop {
          0%   { opacity: 0; transform: scale(0.7); }
          100% { opacity: 1; transform: scale(1); }
        }
        @keyframes splashGlow {
          0%   { opacity: 0.6; transform: scale(1); }
          100% { opacity: 1;   transform: scale(1.15); }
        }
        @keyframes splashFadeUp {
          0%   { opacity: 0; transform: translateY(10px); }
          100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes splashBounce {
          0%, 100% { transform: translateY(0);    opacity: 0.4; }
          50%       { transform: translateY(-6px); opacity: 1;   }
        }
      </style>
      <div class="splash-orb"></div>
      <div class="splash-icon-wrap">
        <div class="splash-glow"></div>
        <div class="splash-icon">⚖️</div>
      </div>
      <p class="splash-title">Estudio Jurídico</p>
      <p class="splash-subtitle">Sistema de Gestión Profesional</p>
      <div class="splash-dots">
        <div class="splash-dot"></div>
        <div class="splash-dot"></div>
        <div class="splash-dot"></div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      window.__hideSplash = function() {
        var s = document.getElementById('splash');
        if (s) {
          s.classList.add('hide');
          setTimeout(function() { s.remove(); }, 600);
        }
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
